[project]
name = "bomscout"
version = "0.1.0"
description = "Parts-sourcing agent for robotics builds: compatibility graph, live offers, budget checks"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0",
    "openai>=1.50",
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "trueforge-sdk>=0.180.0",
    "mcp>=2.3.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
